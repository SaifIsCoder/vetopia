- runFlow: subflows/login.yaml

# ── Open Notifications ──────────────────────────────────────
# The notification bell is typically in the home screen header
- tapOn:
    text: "Notifications"
    optional: true

# If we reached the notifications screen
- assertVisible:
    text: "Notifications"
    optional: true

# ── Back ────────────────────────────────────────────────────
- back
