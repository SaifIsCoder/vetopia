# ============================================================
# E2E Test: Auth Flow — Forgot Password
# ============================================================
# Covers: Password reset request and confirmation screen

appId: com.vetopia.app
name: "Auth - Forgot Password Flow"
tags:
  - auth

---

- assertVisible:
    text: "(?i).*already have an account.*"
- tapOn:
    text: "(?i).*already have an account.*"

- assertVisible:
    text: "Welcome Back"
- tapOn:
    text: "(?i).*Forgot Password.*"

# ── Forgot Password Screen ─────────────────────────────────
- assertVisible:
    text: "Password Reset"

# ── Edge Case: Empty email ──────────────────────────────────
- tapOn:
    text: "(?i)SEND RECOVERY LINK"
- assertVisible:
    text: "Please enter a valid email address."

# ── Happy Path: Valid email ─────────────────────────────────
- tapOn:
    text: "your.email@example.com"
- inputText: "e2e-petparent@vetopia.test"
- hideKeyboard
- tapOn:
    text: "(?i)SEND RECOVERY LINK"

# Should show confirmation screen (when backend is live)
- assertVisible:
    text: "Check Your Email"
    optional: true
- assertVisible:
    text: "Return to Sign In"
    optional: true

# Navigate back to login
- tapOn:
    text: "Return to Sign In"
    optional: true
